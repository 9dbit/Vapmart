name: CP40 Private Draft Verification
on:
  push:
    branches: [work/cp40-private-drafts-20261103]
    paths: ['apps/**','scripts/cp40-browser.mjs','.github/workflows/cp40-private-drafts.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp40-private-drafts
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapmart_test
          POSTGRES_PASSWORD: disposable_cp40_only
          POSTGRES_DB: vapmart_cp39_cp40
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vapmart_test -d vapmart_cp39_cp40"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://vapmart_test:disposable_cp40_only@127.0.0.1:5432/vapmart_cp39_cp40
      CP39_LOCAL_TEST: '1'
      CHECKOUT_ENABLED: 'false'
      DIGITAL_COMMERCE_ENABLED: 'false'
      PAYMENT_MODE: disabled
      SHIPPING_RATE_LOOKUP_ENABLED: 'false'
      BITESHIP_WEBHOOK_ENABLED: 'false'
      SHIPPING_FEE_IDR: '15000'
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_only_not_a_real_key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed source and preserved systems
        run: |
          mkdir -p artifacts/cp40
          git rev-parse HEAD > artifacts/cp40/verified-source.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for path,sha in {'apps/api/src/catalog-workspace.ts':'dc5624dd345bf65adc647212c842607fb6261e3b4dc281bb3a3b6558510ca57c','apps/api/src/products.ts':'2a66e5314729dbf0f7045911eacde29fa41f2e6e47cc514bb82b29a63934936f','apps/api/test/catalog-private-drafts.test.ts':'c32bc74a9a26087b2f036be6b2ef999fba7369218e080f53e3ec1d1022a20b51'}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          PY
          git diff --exit-code 10bc9335cf65559cfdf13b847b1877edd9e1a1e3 -- apps/web apps/api/sql apps/api/src/auth.ts apps/api/src/catalog-validation.ts apps/api/src/catalog-import.ts apps/api/src/checkout.ts apps/api/src/shipping.ts apps/api/src/hero-banners.ts
      - name: Clean dependency install, API build and unit tests
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund --prefix apps/api
          npm run build --prefix apps/api
          npm test --prefix apps/api 2>&1 | tee artifacts/cp40/unit-tests.log
      - name: Migrate twice and verify draft boundaries on real disposable PostgreSQL
        working-directory: apps/api
        run: |
          set -o pipefail
          npm run migrate && npm run migrate
          npx tsx --test test/integration/private-drafts.ts 2>&1 | tee ../../artifacts/cp40/private-drafts-http.log
      - name: Catalog, integrity, warehouse, courier and banner regressions
        working-directory: apps/api
        run: |
          set -o pipefail
          for ENTRY in 'catalog-engine:catalog' 'cp37a-integrity:integrity' 'warehouse-fulfillment:warehouse' 'courier-orchestration:courier'; do
            TEST=${ENTRY%%:*}; DB="vapmart_cp39_cp40_${ENTRY##*:}"
            psql "$DATABASE_URL" -c "CREATE DATABASE $DB"
            URL="postgres://vapmart_test:disposable_cp40_only@127.0.0.1:5432/$DB"
            DATABASE_URL="$URL" npm run migrate
            DATABASE_URL="$URL" npx tsx --test "test/integration/$TEST.ts" 2>&1 | tee "../../artifacts/cp40/$TEST.log"
          done
          psql "$DATABASE_URL" -c 'CREATE DATABASE vapmart_cp38_cp40'
          URL='postgres://vapmart_test:disposable_cp40_only@127.0.0.1:5432/vapmart_cp38_cp40'
          DATABASE_URL="$URL" npm run migrate
          DATABASE_URL="$URL" HERO_LOCAL_TEST=1 npx tsx --test test/integration/hero-banners.ts 2>&1 | tee ../../artifacts/cp40/hero.log
      - name: Web production build
        run: npm ci --no-audit --no-fund --prefix apps/web && npm run build --prefix apps/web
      - name: Browser tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Existing browser lifecycle and new private-draft mobile lifecycle
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -c 'CREATE DATABASE vapmart_cp39_cp40_browser'
          export DATABASE_URL='postgres://vapmart_test:disposable_cp40_only@127.0.0.1:5432/vapmart_cp39_cp40_browser'
          npm run migrate --prefix apps/api
          node scripts/cp39-fixture-server.cjs > artifacts/cp40/api.log 2>&1 &
          API_PID=$!
          (cd apps/web && npm run start) > artifacts/cp40/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 180s node scripts/cp39-browser.mjs 2>&1 | tee artifacts/cp40/cp39-browser.log
          timeout --signal=TERM --kill-after=10s 180s node scripts/cp40-browser.mjs 2>&1 | tee artifacts/cp40/cp40-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp40-private-drafts-verification
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
