name: Admin Control Panel responsive QA
on:
  push:
    branches: [feat/ecommerce-foundation-20261029]
  workflow_dispatch:
jobs:
  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
      - name: Assert verified-admin UX with isolated mocked data
        run: node scripts/admin-ui-smoke.mjs
      - name: Verify official ecommerce logo in admin light and dark modes
        run: node scripts/admin-logo-smoke.mjs
      - name: Save admin logo visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-official-logo-qa
          path: artifacts/admin-official-logo/
          retention-days: 7
          if-no-files-found: ignore
