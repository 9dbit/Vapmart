name: Theme mode browser QA
on:
  push:
    branches: [feat/ecommerce-foundation-20261029]
  workflow_dispatch:
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test harness
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
      - name: Check dark/light/system, storage and mobile layout
        run: node scripts/theme-smoke.mjs
