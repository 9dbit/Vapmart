name: Vapmart Catalog Bulk Publish QA

on:
  push:
    branches:
      - feat/catalog-bulk-publish-20261123
      - release/vapmart-stable
    paths:
      - "apps/api/src/catalog-workspace.ts"
      - "apps/api/src/catalog-controller.ts"
      - "apps/api/test/catalog-bulk-publish.test.ts"
      - "apps/web/src/components/catalog-product-list.tsx"
      - "apps/web/src/components/catalog-product-editor.tsx"
      - "apps/web/src/components/catalog-admin-shell.tsx"
      - "apps/web/src/app/catalog-bulk-publish.css"
      - ".github/workflows/catalog-bulk-publish-qa.yml"
  pull_request:
    branches: [release/vapmart-stable]
    paths:
      - "apps/api/src/catalog-workspace.ts"
      - "apps/api/src/catalog-controller.ts"
      - "apps/api/test/catalog-bulk-publish.test.ts"
      - "apps/web/src/components/catalog-product-list.tsx"
      - "apps/web/src/components/catalog-product-editor.tsx"
      - "apps/web/src/components/catalog-admin-shell.tsx"
      - "apps/web/src/app/catalog-bulk-publish.css"
      - ".github/workflows/catalog-bulk-publish-qa.yml"
jobs:
  api-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        working-directory: apps/api
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck backend
        working-directory: apps/api
        run: npm run typecheck
      - name: Test audited publish and validation guards
        working-directory: apps/api
        run: npx tsx --test test/catalog-bulk-publish.test.ts
      - name: Build backend
        working-directory: apps/api
        run: npm run build
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: apps/web
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Build Next.js storefront
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
