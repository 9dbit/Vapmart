name: CP50 CSV Import Recovery QA
on:
  push:
    branches: [feat/vapmart-cp50-csv-import-20261117]
  pull_request:
    branches: [release/vapmart-stable]
permissions:
  contents: read
jobs:
  api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKOUT_ENABLED: 'false'
      DIGITAL_COMMERCE_ENABLED: 'false'
      PAYMENT_MODE: disabled
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm ci --no-audit --no-fund --prefix apps/api
      - name: Compile API
        run: npm run build --prefix apps/api
      - name: Run all API unit tests (CSV regressions)
        run: npm test --prefix apps/api
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefix apps/web
      - name: Compile Next.js frontend
        run: npm run build --prefix apps/web
