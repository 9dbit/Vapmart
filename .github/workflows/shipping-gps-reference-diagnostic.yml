name: Shipping GPS Reference Diagnostic
on:
  push:
    branches: [fix/shipping-gps-autofill-20261123]
    paths:
      - scripts/shipping-gps-reference-diagnostic.mjs
      - .github/workflows/shipping-gps-reference-diagnostic.yml
  workflow_dispatch:
jobs:
  reference-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/shipping-gps-reference-diagnostic.mjs
