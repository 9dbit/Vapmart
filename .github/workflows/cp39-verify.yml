name: CP39 Product Engine Verification
on:
  push:
    branches: [work/cp39-product-engine-20261103]
    paths: ['apps/**','scripts/cp39-*','.github/workflows/cp39-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp39-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapmart_test
          POSTGRES_PASSWORD: disposable_cp39_password
          POSTGRES_DB: vapmart_cp39_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vapmart_test -d vapmart_cp39_engine"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://vapmart_test:disposable_cp39_password@127.0.0.1:5432/vapmart_cp39_engine
      CP39_LOCAL_TEST: '1'
      CHECKOUT_ENABLED: 'false'
      DIGITAL_COMMERCE_ENABLED: 'false'
      PAYMENT_MODE: disabled
      SHIPPING_RATE_LOOKUP_ENABLED: 'false'
      BITESHIP_WEBHOOK_ENABLED: 'false'
      SHIPPING_FEE_IDR: '15000'
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_only_not_a_real_key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p artifacts/cp39
      - name: Build API and unit tests
        working-directory: apps/api
        run: npm ci --no-audit --no-fund && npm run build && npm test
      - name: Preserve existing auth, hero and original assets
        run: git diff --exit-code af47f967f5e32a8508ee274edc2de47237792bb6 -- apps/api/src/auth.ts apps/api/src/hero-banners.ts apps/api/src/hero-banners-controller.ts apps/web/src/components/hero-banner-manager.tsx apps/web/public apps/api/resources apps/api/sql/001_initial.sql apps/api/sql/016_hero_banners.sql
      - name: Additive migration twice and full HTTP engine acceptance
        working-directory: apps/api
        run: |
          set -o pipefail
          npm run migrate && npm run migrate
          npx tsx --test test/integration/catalog-engine.ts 2>&1 | tee ../../artifacts/cp39/engine-http.log
      - name: Isolated prior integrity and fulfillment regressions
        working-directory: apps/api
        run: |
          for ENTRY in "cp37a-integrity:integrity" "warehouse-fulfillment:warehouse" "courier-orchestration:courier"; do
            TEST=${ENTRY%%:*}
            DB="vapmart_cp39_${ENTRY##*:}"
            psql "$DATABASE_URL" -c "CREATE DATABASE $DB"
            URL="postgres://vapmart_test:disposable_cp39_password@127.0.0.1:5432/$DB"
            DATABASE_URL="$URL" npm run migrate
            DATABASE_URL="$URL" npx tsx --test "test/integration/$TEST.ts"
          done
          psql "$DATABASE_URL" -c 'CREATE DATABASE vapmart_cp38_regression'
          URL='postgres://vapmart_test:disposable_cp39_password@127.0.0.1:5432/vapmart_cp38_regression'
          DATABASE_URL="$URL" npm run migrate
          DATABASE_URL="$URL" HERO_LOCAL_TEST=1 npx tsx --test test/integration/hero-banners.ts
      - name: Build Web
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Browser test tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Full-stack local browser lifecycle
        timeout-minutes: 6
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -c 'CREATE DATABASE vapmart_cp39_browser'
          export DATABASE_URL='postgres://vapmart_test:disposable_cp39_password@127.0.0.1:5432/vapmart_cp39_browser'
          npm run migrate --prefix apps/api
          node scripts/cp39-fixture-server.cjs > artifacts/cp39/api.log 2>&1 &
          API_PID=$!
          (cd apps/web && npm run start) > artifacts/cp39/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=10s 240s node scripts/cp39-browser.mjs 2>&1 | tee artifacts/cp39/browser.log
          git rev-parse HEAD > artifacts/cp39/verified-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp39-verification
          path: artifacts/cp39/
          if-no-files-found: ignore
          retention-days: 7
