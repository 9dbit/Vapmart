name: CP38 Source Bundle
on:
  push:
    branches: [work/cp38-hero-banners-20261103]
    paths: [.github/workflows/cp38-source-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare tracked source and image decoder lockfile
        run: |
          mkdir -p /tmp/cp38-source
          git archive --format=tar HEAD > /tmp/cp38-source/source.tar
          npm ci --no-audit --no-fund --prefix apps/api
          npm install --save-exact --no-audit --no-fund --prefix apps/api sharp@0.35.3
          tar -czf /tmp/cp38-source/api-tooling.tgz -C apps/api node_modules package.json package-lock.json
          npm ci --no-audit --no-fund --prefix apps/web
          tar -czf /tmp/cp38-source/web-tooling.tgz -C apps/web node_modules
          git rev-parse HEAD > /tmp/cp38-source/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cp38-source-tooling
          path: /tmp/cp38-source/
          retention-days: 3
          compression-level: 0
