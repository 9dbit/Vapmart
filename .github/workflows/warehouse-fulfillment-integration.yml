name: Warehouse & Fulfillment PostgreSQL Integration
on:
  push:
    branches: [feat/ecommerce-foundation-20261029]
  workflow_dispatch:
jobs:
  warehouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapmart_test
          POSTGRES_PASSWORD: disposable_warehouse_password
          POSTGRES_DB: vapmart_cp35_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vapmart_test -d vapmart_cp35_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://vapmart_test:disposable_warehouse_password@127.0.0.1:5432/vapmart_cp35_test
      PAYMENT_MODE: disabled
      CHECKOUT_ENABLED: "false"
      SHIPPING_RATE_LOOKUP_ENABLED: "false"
      DIGITAL_COMMERCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Migrate ephemeral PostgreSQL
        run: npm run migrate
      - name: Ensure migration is idempotent
        run: npm run migrate
      - name: Execute multiwarehouse, reservation and brand isolation integration
        run: npx tsx --test test/integration/warehouse-fulfillment.ts
      - name: Execute CP36 courier events and returns integration without outside network
        run: npx tsx --test test/integration/courier-orchestration.ts
