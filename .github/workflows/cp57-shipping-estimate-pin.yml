name: CP57 Guest Shipping and Map Pin QA
on:
  push:
    branches: [fix/vapmart-cp57-shipping-estimate-pin-20261118]
  pull_request:
    branches: [release/vapmart-stable]
permissions:
  contents: read
jobs:
  api-web-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapmart_test
          POSTGRES_DB: vapmart_cp39_cp46_shipping
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vapmart_test -d vapmart_cp39_cp46_shipping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://vapmart_test@127.0.0.1:5432/vapmart_cp39_cp46_shipping
      CP39_LOCAL_TEST: '1'
      CHECKOUT_ENABLED: 'false'
      DIGITAL_COMMERCE_ENABLED: 'false'
      SHIPPING_RATE_LOOKUP_ENABLED: 'false'
      PAYMENT_MODE: disabled
      SHIPPING_FEE_IDR: '15000'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm ci --no-audit --no-fund --prefix apps/api
      - name: Build API
        run: npm run build --prefix apps/api
      - name: Run API unit tests
        run: npm test --prefix apps/api
      - name: Apply migrations and run PostgreSQL integration tests
        working-directory: apps/api
        run: |
          npm run migrate
          npm run migrate
          npx tsx --test test/integration/checkout-conversion.ts
          npx tsx --test test/integration/address-checkout.ts
          npx tsx --test test/integration/shipping-estimate-pin.ts
          npx tsx --test test/integration/jubelio-dispatch.ts
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund --prefix apps/web
      - name: Build web
        run: npm run build --prefix apps/web
      - name: Exercise recipient map and shipping controls on phone and desktop
        run: |
          python -m pip install playwright==1.56.0
          PORT=3208 npm start --prefix apps/web > "$RUNNER_TEMP/checkout-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3208/checkout > /dev/null; then break; fi
            sleep 1
          done
          python scripts/checkout-recipient-map-test.py
