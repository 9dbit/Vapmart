name: WordPress to Nextjs reference capture
on:
  push:
    branches: [feat/ecommerce-foundation-20261029]
    paths:
      - .github/workflows/reference-capture.yml
      - scripts/capture-parity.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
      - name: Compare Vapmart public reference and staging
        run: node scripts/capture-parity.mjs
