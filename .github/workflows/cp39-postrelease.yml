name: CP39 Post-release Verification
on:
  push:
    branches: [work/cp39-product-engine-20261103]
    paths: [sources/cp39-release.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bounded browser tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: CP39 public reads, denials and read-only fixture UI
        run: |
          set -o pipefail
          mkdir -p artifacts/cp39-live
          timeout --signal=TERM --kill-after=10s 240s node scripts/live-cp39.mjs 2>&1 | tee artifacts/cp39-live/acceptance.log
      - name: Existing theme and membership regression
        run: timeout --signal=TERM --kill-after=10s 180s node scripts/theme-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp39-live-verification
          path: artifacts/cp39-live/
          retention-days: 7
          if-no-files-found: error
