name: Vapmart Chatvice domain validation
on:
  push:
    branches:
      - fix/vapmart-chatvice-domain-validation-20261119
  pull_request:
    branches:
      - release/vapmart-stable
    paths:
      - apps/web/src/app/layout.tsx
      - apps/web/src/components/vapmart-care.tsx
      - scripts/vapmart-chatvice-domain-ssr.mjs
      - .github/workflows/vapmart-chatvice-domain-validation.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --include=dev --no-audit --no-fund
      - name: Build Vapmart
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify server-rendered Chatvice marker and client widget
        run: node scripts/vapmart-chatvice-domain-ssr.mjs
